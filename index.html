<!DOCTYPE html>
<html lang="vi">

  <style>

    .pointer {

    .note { font-size: 11px; color: #667085; line-height: 1.45; background: #f8fafc; border-radius: 10px; padding: 9px; }

    .dark { --bg1: #0b1020; --bg2: #111827; --panel: rgba(17, 24, 39, .93); --text: #f3f4f6; --muted: #98a2b3; --line: #374151; }

    @media(max-width: 650px) {
      .app { padding: 9px; } .topbar { position: static; height: auto; } .toolbar { justify-content: flex-start; } .layout { margin-top: 9px; }
      .wheel-card { padding: 9px; } .center-label { width: 88px; height: 88px; } .center-label span { font-size: 11px; }
    }

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">↻</div>
    <div class="titlebox">
      <h1>Vòng quay danh sách lớp 11A3</h1>
      <p>34 học sinh • Xác suất mặc định chia đều • Chọn cả lớp / Nam / Nữ</p>
    </div>
    <div class="toolbar">
      <button class="btn" id="saveBtn">Lưu</button>
      <button class="btn" id="openBtn">Mở bản lưu</button>
      <button class="btn primary" id="shareBtn">Chia sẻ</button>
      <button class="btn icon" id="themeBtn" title="Chế độ Sáng/Tối">◐</button>
      <button class="btn icon" id="fullBtn" title="Toàn màn hình">⛶</button>
    </div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="wheel-card">
        <div class="wheel-head">
          <h2 id="wheelTitle">Vòng quay 11A3</h2>
          <div class="badges">
            <span class="badge" id="countBadge">34 học sinh</span>
            <span class="badge" id="probBadge">Mỗi bạn ≈ 2,94%</span>
          </div>
        </div>
        <div class="wheel-wrap">
          <canvas id="wheel" width="900" height="900" aria-label="Vòng quay"></canvas>
          <div class="pointer" id="wheelPointer"></div>
          <div class="center-label" id="centerLabel" title="Bấm vào để quay">
            <span>NHẤP ĐỂ<br>QUAY</span>
            <img id="centerImg" alt="">
          </div>
        </div>
        <div class="filterbar">
          <button class="filter active" data-filter="all" onclick="setFilter('all')">Cả lớp</button>
          <button class="filter" data-filter="M" onclick="setFilter('M')">Nam</button>
          <button class="filter" data-filter="F" onclick="setFilter('F')">Nữ</button>
        </div>
        <div class="spin-hint">Nhấp vào tâm vòng quay hoặc nhấn <b>Phím cách (Space) / Enter</b> để quay</div>
      </div>

      <div class="results">
        <div class="results-head">
          <h3>Lịch sử kết quả</h3>
          <div class="entry-actions">
            <button class="btn" id="clearResultsBtn">Xóa lịch sử</button>
            <button class="btn" id="exportResultsBtn">Xuất kết quả</button>
          </div>
        </div>
        <div class="result-list" id="resultList"></div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="standard">Cơ bản</button>
        <button class="tab" data-tab="advanced">Nâng cao</button>
        <button class="tab" data-tab="options">Tùy chỉnh</button>
      </div>
      <div class="panel-scroll" id="panelScroll"></div>
    </aside>
  </main>
</div>

<div class="overlay" id="winnerOverlay">
  <div class="modal">
    <div style="text-align:center;color:#667085;font-weight:800;font-size:12px;letter-spacing:1px">KẾT QUẢ VÒNG QUAY</div>
    <div class="winner" id="winnerName"></div>
    <div style="text-align:center;color:#667085;font-size:14px;margin-bottom:20px" id="winnerMessage">Đã chọn được học sinh may mắn!</div>
    <div class="modal-actions">
      <button class="btn danger" id="removeWinnerBtn" onclick="removeCurrentWinner()">Loại khỏi vòng quay</button>
      <button class="btn primary" id="closeWinnerBtn" onclick="closeWinnerPopup()">Đóng</button>
    </div>
  </div>
</div>

<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>

<script>
// Danh sách đầy đủ 34 học sinh lớp 11A3 (20 Nam, 14 Nữ)
const CLASS = [
  {name:"Bùi Tuyết Anh", gender:"F"},
  {name:"Đỗ Phan Hoài Anh", gender:"M"},
  {name:"Nguyễn Hoàng Ngân Anh", gender:"F"},
  {name:"Nguyễn Huỳnh Tuấn Anh", gender:"M"},
  {name:"Nguyễn Tuấn Anh", gender:"M"},
  {name:"Lê Đình Nhật Bằng", gender:"M"},
  {name:"Lê Nguyễn Ngọc Bích", gender:"F"},
  {name:"Nguyễn Đoàn Bảo Chi", gender:"F"},
  {name:"Nguyễn Tường Duy", gender:"M"},
  {name:"Ngô Gia Đạt", gender:"M"},
  {name:"Phạm Quỳnh Giang", gender:"F"},
  {name:"Đoàn Thanh Huy", gender:"M"},
  {name:"Lê Hoàng Nhựt Huy", gender:"M"},
  {name:"Lê Huỳnh Hoàng Huy", gender:"M"},
  {name:"Trần Thanh Huy", gender:"M"},
  {name:"Lâm Minh Nguyễn Khang", gender:"M"},
  {name:"Huỳnh Gia Khiêm", gender:"M"},
  {name:"Lê Tuấn Kiệt", gender:"M"},
  {name:"Nguyễn Tuấn Minh", gender:"M"},
  {name:"Tôn Gia Nghi", gender:"F"},
  {name:"Đoàn Nguyễn Phương Nhi", gender:"F"},
  {name:"Phan Trọng Phú", gender:"M"},
  {name:"Lê Trần Duy Phước", gender:"M"},
  {name:"Phạm Tấn Tài", gender:"M"},
  {name:"Phan Nguyễn Hoàng Thiện", gender:"M"},
  {name:"Võ Ngọc Thịnh", gender:"M"},
  {name:"Phạm Đào Kim Thư", gender:"F"},
  {name:"Nguyễn Ngọc Bích Trâm", gender:"F"},
  {name:"Nguyễn Phuợng Trinh", gender:"F"},
  {name:"Đặng Lê Ngọc Trọng", gender:"M"},
  {name:"Nguyễn Thị Mộng Tuyền", gender:"F"},
  {name:"Nguyễn Minh Tuyết", gender:"F"},
  {name:"Nguyễn Thị Tường Vy", gender:"F"},
  {name:"Nguyễn Thị Như Ý", gender:"F"}
].map((x, i) => ({...x, id: i + 1, enabled: true, weight: 1, color: null, message: "Đã chọn được học sinh may mắn!"}));

const themes = {
  Classic:["#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899"],
  "Cotton Candy":["#f9a8d4","#c4b5fd","#93c5fd","#a7f3d0","#fde68a","#fecdd3"],
  Rainbow:["#ef4444","#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#8b5cf6"],
  "Enchanted Forest":["#14532d","#166534","#15803d","#65a30d","#84cc16","#365314"],
  Ocean:["#082f49","#0369a1","#0284c7","#06b6d4","#0e7490","#164e63"],
  Sunset:["#7c2d12","#ea580c","#f97316","#f43f5e","#db2777","#9333ea"]
};

const STORAGE_KEY = "wheel11a3_v13";

let state = {
  entries: CLASS.map(x => ({...x})),
  filter: "all",
  rotation: 0,
  spinning: false,
  results: [],
  duration: 10,
  spinVolume: .45,
  winVolume: .7,
  slow: false,
  showTitle: true,
  displayDuplicates: false,
  maxEntries: 1000,
  animateWinner: true,
  confetti: true,
  popup: true,
  autoRemove: false,
  shadow: true,
  contours: true,
  pointerColor: true,
  theme: "Classic",
  colors: [...themes.Classic],
  centerSize: "M",
  centerText: "NHẤP ĐỂ\nQUAY",
  message: "Đã chọn được học sinh may mắn!"
};

let lastSelectedStudent = null;
let autoRemoveTimer = null;
let audioCtx = null;
let lastPegIndex = -1;

const $ = id => document.getElementById(id);
const wheel = $("wheel"), ctx = wheel.getContext("2d");

// ========================================================
// OFFSCREEN BUFFER PRE-RENDERING (DỰNG HÌNH ĐỆM ĐẠT 60-120 FPS)
// ========================================================
const bufferCanvas = document.createElement("canvas");
const bufferCtx = bufferCanvas.getContext("2d");
let cachedDimension = 0;

function cloneEntries(){
  return state.entries.filter(e => {
    const isEnabled = e.enabled !== false;
    if(!isEnabled) return false;
    if(state.filter === "all") return true;
    if(state.filter === "M") return e.gender === "M" || e.gender === "Nam";
    if(state.filter === "F") return e.gender === "F" || e.gender === "Nữ";
    return true;
  });
}

function pct(){
  const n = cloneEntries().length;
  return n ? (100 / n).toFixed(2) : "0.00";
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2400);
}

function saveLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({...state, rotation: 0, spinning: false}));
}

function loadLocal(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try {
    const s = JSON.parse(raw);
    state = {...state, ...s};
    if(state.entries && state.entries.length === CLASS.length){
      state.entries = state.entries.map((e, idx) => ({
        ...CLASS[idx],
        ...e,
        gender: CLASS[idx].gender
      }));
    } else {
      state.entries = CLASS.map(x => ({...x}));
    }
  } catch(e) {}
}

function syncCanvasSize(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const rect = wheel.getBoundingClientRect();
  const size = Math.round((rect.width || 700) * dpr);
  if(wheel.width !== size || cachedDimension !== size){
    wheel.width = size;
    wheel.height = size;
    bufferCanvas.width = size;
    bufferCanvas.height = size;
    cachedDimension = size;
  }
}

// Dựng sẵn nan quạt + chữ lên buffer đúng 1 lần
function bakeWheel(){
  syncCanvasSize();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const W = bufferCanvas.width, H = bufferCanvas.height;
  const cx = W / 2, cy = H / 2, R = (W / dpr) * 0.455 * dpr;
  
  bufferCtx.clearRect(0, 0, W, H);
  const list = cloneEntries();

  if(!list.length){
    bufferCtx.beginPath(); bufferCtx.arc(cx, cy, R, 0, Math.PI * 2);
    bufferCtx.fillStyle = "#f2f4f7"; bufferCtx.fill();
    bufferCtx.fillStyle = "#667085"; bufferCtx.font = `700 ${18 * dpr}px system-ui`;
    bufferCtx.textAlign = "center"; bufferCtx.textBaseline = "middle";
    bufferCtx.fillText("Không còn học sinh nào", cx, cy);
    return;
  }

  if(state.shadow){
    bufferCtx.save();
    bufferCtx.beginPath(); bufferCtx.arc(cx, cy, R + (4 * dpr), 0, Math.PI * 2);
    bufferCtx.shadowColor = "rgba(15, 23, 42, .24)";
    bufferCtx.shadowBlur = 20 * dpr;
    bufferCtx.shadowOffsetY = 8 * dpr;
    bufferCtx.fillStyle = "#fff"; bufferCtx.fill();
    bufferCtx.restore();
  }

  const arc = (Math.PI * 2) / list.length;
  const fixedFontSize = 13 * dpr;
  const centerRadius = ((state.centerSize === "XL" ? 88 : state.centerSize === "L" ? 73 : state.centerSize === "S" ? 44 : 59) + 12) * dpr;
  const maxTextWidth = R - centerRadius - (15 * dpr);

  list.forEach((e, i) => {
    const a0 = i * arc - Math.PI / 2;
    const a1 = a0 + arc;

    bufferCtx.beginPath();
    bufferCtx.moveTo(cx, cy);
    bufferCtx.arc(cx, cy, R, a0, a1);
    bufferCtx.closePath();
    bufferCtx.fillStyle = e.color || state.colors[i % state.colors.length];
    bufferCtx.fill();

    if(state.contours){
      bufferCtx.strokeStyle = "rgba(255, 255, 255, .92)";
      bufferCtx.lineWidth = 2 * dpr;
      bufferCtx.stroke();
    }

    const mid = a0 + arc / 2;
    bufferCtx.save();
    bufferCtx.translate(cx, cy);
    bufferCtx.rotate(mid);
    bufferCtx.textAlign = "right";
    bufferCtx.textBaseline = "middle";
    bufferCtx.font = `700 ${fixedFontSize}px Inter, system-ui, sans-serif`;

    let txt = e.name;
    if(bufferCtx.measureText(txt).width > maxTextWidth){
      while(txt.length > 0 && bufferCtx.measureText(txt + "...").width > maxTextWidth){
        txt = txt.slice(0, -1);
      }
      txt = txt + "...";
    }

    bufferCtx.fillStyle = "#ffffff";
    bufferCtx.shadowColor = "rgba(0, 0, 0, 0.45)";
    bufferCtx.shadowBlur = 3 * dpr;
    bufferCtx.shadowOffsetX = 1 * dpr;
    bufferCtx.shadowOffsetY = 1 * dpr;
    bufferCtx.fillText(txt, R - (16 * dpr), 0);
    bufferCtx.restore();
  });
}

function drawWheel(){
  const W = wheel.width, H = wheel.height;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(state.rotation);
  ctx.drawImage(bufferCanvas, -W / 2, -H / 2);
  ctx.restore();
}

function setFilter(filterType){
  if(state.spinning) return;
  state.filter = filterType;
  
  document.querySelectorAll(".filter").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-filter") === filterType);
  });

  bakeWheel();
  drawWheel();
  saveLocal();
  updateUI(false);

  const count = cloneEntries().length;
  toast(filterType === "all" ? `Đã chọn: Cả lớp (${count} học sinh)` : filterType === "M" ? `Đã chọn: Nam (${count} học sinh)` : `Đã chọn: Nữ (${count} học sinh)`);
}

function updateUI(reBake = true){
  if(reBake) bakeWheel();
  drawWheel();

  const list = cloneEntries();
  if($("countBadge")) $("countBadge").textContent = `${list.length} học sinh`;
  if($("probBadge")) $("probBadge").textContent = list.length ? `Mỗi bạn ≈ ${pct()}%` : "0%";

    $("wheelTitle").style.display = state.showTitle ? "block" : "none";

  }

  document.querySelectorAll(".filter").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-filter") === state.filter);
  });

  if($("centerLabel")) {
    const labelSize = {S: 88, M: 118, L: 145, XL: 175}[state.centerSize] || 118;
    $("centerLabel").style.width = labelSize + "px";

    if($("winVolText")) $("winVolText").textContent = Math.round(state.winVolume * 100) + "%";

  };

  const simpleChecks = [
    ["slow", v => state.slow = v],
    ["showTitle", v => { state.showTitle = v; if($("wheelTitle")) $("wheelTitle").style.display = v ? "block" : "none"; }],
    ["dupes", v => state.displayDuplicates = v],
    ["maxEntries", v => state.maxEntries = Math.max(4, Math.min(1000, +v || 1000))],
    ["animateWinner", v => state.animateWinner = v],
    ["confettiOn", v => state.confetti = v],
    ["popup", v => state.popup = v],
    ["autoRemove", v => state.autoRemove = v],
    ["shadow", v => { state.shadow = v; updateUI(); }],
    ["contours", v => { state.contours = v; updateUI(); }],
    ["pointerColor", v => state.pointerColor = v]
  ];

  simpleChecks.forEach(([id, fn]) => {
    const el = $(id);
    if(!el) return;
    el.onchange = () => {
      fn(el.type === "checkbox" ? el.checked : el.value);
      saveLocal();
    };

  if($("themeSelect")) $("themeSelect").onchange = e => applyTheme(e.target.value);

function escapeHtml(s){ return (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

function shuffleEntries(){
  for(let i = state.entries.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [state.entries[i], state.entries[j]] = [state.entries[j], state.entries[i]];
  }
  saveLocal(); updateUI(); toast("Đã xáo trộn danh sách học sinh ngẫu nhiên");
}

function restoreEntries(){

function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
}

function playTickSound(){
  if(state.spinVolume <= 0) return;
  try {
    ensureAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.exponentialRampToValueAtTime(140, t + 0.016);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.38 * state.spinVolume, t + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.016);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.018);
  } catch(e) {}
}

function playWinSound(){
  if(state.winVolume <= 0) return;
  try {
    ensureAudio();
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      const t = audioCtx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.55 * state.winVolume, t + 0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.25);
    });
  } catch(e) {}
}

function confetti(){
  if(!state.confetti) return;
  const c = $("confetti"); c.innerHTML = "";
  for(let i = 0; i < 85; i++){
    const x = document.createElement("i");
    x.style.left = Math.random() * 100 + "%";
    x.style.top = (-10 - Math.random() * 20) + "%";
    x.style.background = `hsl(${Math.random() * 360}, 85%, 60%)`;
    x.style.transform = `rotate(${Math.random() * 180}deg)`;
    x.style.animationDelay = (Math.random() * 0.6) + "s";
    c.appendChild(x);
  }
  setTimeout(() => c.innerHTML = "", 3300);
}

function spin(){
  if(state.spinning) return;
  const list = cloneEntries();
  if(!list.length){ toast("Không còn học sinh nào trong nhóm này"); return; }
  if(list.length > state.maxEntries){ toast("Vượt quá số lượng mục hiển thị tối đa"); return; }
  
  ensureAudio();
  state.spinning = true;

  const arc = (Math.PI * 2) / list.length;
  const fullTurns = (state.slow ? 8 : 16) + Math.floor(Math.random() * 6);
  const randomContinuousAngle = Math.random() * (Math.PI * 2);

  const start = state.rotation;
  const end = start + fullTurns * Math.PI * 2 + randomContinuousAngle;
  const dur = state.duration * 1000;
  const t0 = performance.now();
  lastPegIndex = -1;

  function ease(t){
    return 1 - Math.pow(1 - t, 3.8);
  }

  function frame(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = ease(p);
    state.rotation = start + (end - start) * e;
    drawWheel();

    const currentPeg = Math.floor((state.rotation + Math.PI / 2) / arc);
    if(currentPeg !== lastPegIndex){
      playTickSound();
      lastPegIndex = currentPeg;

      const pointer = $("wheelPointer");
      if(pointer){
        pointer.style.transform = "translateY(-50%) rotate(-6deg)";
        clearTimeout(pointer.twitchTimer);
        pointer.twitchTimer = setTimeout(() => {
          pointer.style.transform = "translateY(-50%) rotate(0deg)";
        }, 35);
      }

      if(state.pointerColor){
        const activeIdx = Math.floor(((Math.PI * 2) - ((state.rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / arc) % list.length;
        if(list[activeIdx] && pointer){
          pointer.style.borderRightColor = list[activeIdx].color || state.colors[activeIdx % state.colors.length];
        }
      }
    }

    if(p < 1) requestAnimationFrame(frame);
    else finishSpin();
  }
  requestAnimationFrame(frame);
}

function finishSpin(){
  state.spinning = false;
  state.rotation = ((state.rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const list = cloneEntries();
  if(!list.length) return;

  const arc = (Math.PI * 2) / list.length;
  const pointerAngle = ((Math.PI / 2 - state.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const winningIndex = Math.floor(pointerAngle / arc) % list.length;
  const w = list[winningIndex];
  if(!w) return;

  lastSelectedStudent = w;
  window.currentWinnerObj = w;

  state.results.unshift({ name: w.name, id: w.id, time: Date.now() });
  if(state.results.length > 200) state.results.length = 200;

  saveLocal();
  renderResults();
  playWinSound();
  confetti();

  if(state.animateWinner){
    $("centerLabel").animate([
      { transform: "translate(-50%,-50%) scale(1)" },
      { transform: "translate(-50%,-50%) scale(1.15)" },
      { transform: "translate(-50%,-50%) scale(1)" }
    ], { duration: 650 });
  }

  if(state.popup){
    $("winnerName").textContent = w.name;
    $("winnerMessage").textContent = w.message || state.message;
    $("winnerOverlay").setAttribute("data-winner-id", String(w.id));
    $("winnerOverlay").style.display = "flex";
  }

  clearTimeout(autoRemoveTimer);
  if(state.autoRemove){
    autoRemoveTimer = setTimeout(() => {
      removeCurrentWinner(true);
    }, 5000);
  }
}

function removeCurrentWinner(silent = false){
  clearTimeout(autoRemoveTimer);
  
  const overlay = $("winnerOverlay");
  if(overlay) overlay.style.display = "none";

  let target = window.currentWinnerObj || lastSelectedStudent;
  if(!target && overlay){
    const wid = overlay.getAttribute("data-winner-id");
    if(wid) target = state.entries.find(e => String(e.id) === String(wid));
  }
  if(!target && state.results.length > 0){
    target = state.entries.find(e => e.name === state.results[0].name || e.id === state.results[0].id);
  }

  if(target){
    const found = state.entries.find(e => e.id === target.id || e.name === target.name);
    if(found){
      found.enabled = false;
      toast(`Đã xóa ${found.name} khỏi vòng quay`);
    }
  }

  window.currentWinnerObj = null;
  lastSelectedStudent = null;

  saveLocal();
  updateUI();
}

function closeWinnerPopup(){
  clearTimeout(autoRemoveTimer);
  const overlay = $("winnerOverlay");
  if(overlay) overlay.style.display = "none";
}

function exportResults(){
  if(!state.results.length){ toast("Chưa có kết quả để xuất"); return; }
  
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const day = pad(now.getDate());
  const month = pad(now.getMonth() + 1);
  const year = now.getFullYear();
  const hours = pad(now.getHours());
  const minutes = pad(now.getMinutes());
  const seconds = pad(now.getSeconds());

  const fileName = `ket-qua-vong-quay-11A3_${day}-${month}-${year}_${hours}h${minutes}m${seconds}s.txt`;

  let header = `DANH SÁCH KẾT QUẢ VÒNG QUAY LỚP 11A3\n`;
  header += `Thời gian xuất: ${hours}:${minutes}:${seconds} ngày ${day}/${month}/${year}\n`;
  header += `Tổng số lượt quay trúng: ${state.results.length}\n`;
  header += `--------------------------------------------------\n\n`;

  const content = header + state.results.map((r, i) => `${i + 1}. ${r.name} — ${formatResultTime(r.time)}`).join("\n");

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type: "text/plain;charset=utf-8"}));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Đã xuất tệp: " + fileName);
}

// ========================================================
// HỆ THỐNG CHIA SẺ TOÀN NĂNG (LƯU & ĐỒNG BỘ MỌI THIẾT BỊ)
// ========================================================
function encodeStateToUrl(obj) {
  const json = JSON.stringify(obj);
  return btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (match, p1) => {
    return String.fromCharCode('0x' + p1);
  }));
}

function decodeUrlToState(b64) {
  const binary = atob(b64);
  const json = decodeURIComponent(Array.prototype.map.call(binary, ch => {
    return '%' + ('00' + ch.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(json);
}

function share(){
  try {
    const b64 = encodeStateToUrl(state);
    const url = window.location.origin + window.location.pathname + "#data=" + b64;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => {
        toast("Đã sao chép link chia sẻ đầy đủ dữ liệu!");
      }).catch(() => {
        prompt("Sao chép link chia sẻ toàn bộ dữ liệu:", url);
      });
    } else {
      prompt("Sao chép link chia sẻ toàn bộ dữ liệu:", url);
    }
  } catch(e) {
    toast("Không thể tạo link chia sẻ");
  }
}

function loadHash(){
  if(!location.hash || !location.hash.startsWith("#data=")) return;
  try {
    const b64 = location.hash.slice(6);
    const loaded = decodeUrlToState(b64);
    if(loaded && loaded.entries && loaded.entries.length){
      state = {...state, ...loaded};
      saveLocal();
      try {
        history.replaceState(null, "", window.location.pathname);
      } catch(e){}
      toast("Đã đồng bộ và lưu toàn bộ dữ liệu từ link!");
    }
  } catch(e){
    console.error("Lỗi nạp dữ liệu từ link:", e);
  }
}
